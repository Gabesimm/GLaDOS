<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GLaDOS 3D Viewer (test)</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0a0c; height: 100%; }
  #info { position: fixed; top: 8px; left: 8px; color: #9fe; font-family: monospace; font-size: 12px; z-index: 10; }
  #controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
  #controls button {
    font-family: monospace; font-size: 14px; padding: 10px 18px; border-radius: 6px;
    border: 1px solid #5a5; background: #113; color: #9fe; cursor: pointer;
  }
  #controls button.active { background: #2b6; color: #012; border-color: #2b6; }
  #coreControls { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; }
  #coreControls button {
    font-family: monospace; font-size: 12px; padding: 8px 14px; border-radius: 6px;
    border: 1px solid #a5a; background: #213; color: #fbf; cursor: pointer;
  }
  #coreControls button.active { background: #62b; color: #fff; border-color: #62b; }
</style>
</head>
<body>
<div id="info">loading...</div>
<div id="coreControls">
  <button data-core="default">Default</button>
  <button data-core="variant1">Variant 1</button>
  <button data-core="variant2">Variant 2</button>
  <button data-core="variant3">Variant 3</button>
  <button data-core="damaged">Damaged</button>
</div>
<div id="controls">
  <button data-state="idle">Idle</button>
  <button data-state="listening">Listening</button>
  <button data-state="talking">Talking</button>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const info = document.getElementById('info');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(2, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(3, 5, 2);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-3, 2, -2);
scene.add(fill);

// Procedural stand-in for the GLaDOS chamber: a big cylindrical room tiled with gray panels,
// built from general knowledge of the room's look (large circular chamber, grid of gray/white
// wall panels) rather than any reference image — not a pixel-accurate replica.
function createPanelTexture(cols, rows, colorA, colorB, lineColor) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cellW = size / cols, cellH = size / rows;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const shade = Math.random() * 0.08 - 0.04;
      ctx.fillStyle = (x + y) % 2 === 0 ? colorA : colorB;
      ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, shade)})`;
      ctx.fillRect(x * cellW, y * cellH, cellW, cellH);
    }
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = size * 0.008;
  for (let x = 0; x <= cols; x++) { ctx.beginPath(); ctx.moveTo(x * cellW, 0); ctx.lineTo(x * cellW, size); ctx.stroke(); }
  for (let y = 0; y <= rows; y++) { ctx.beginPath(); ctx.moveTo(0, y * cellH); ctx.lineTo(size, y * cellH); ctx.stroke(); }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function buildChamber(box, center, dist) {
  // Built off a reference screenshot of the actual GLaDOS chamber: she hangs well clear of the
  // floor, and the ceiling mount is a thick ring/housing she plugs straight up through, not a
  // thin panel with a small hole in it.
  const radius = Math.max(dist * 1.6, 14);
  const modelWidth = Math.max(box.max.x - box.min.x, box.max.z - box.min.z);

  const ceilingConnectGap = 0.05; // near zero so the pole visibly plugs into the ring, no gap
  const hoverGap = 6;             // real clearance between her lowest point and the floor
  const ceilingY = box.max.y + ceilingConnectGap;
  const floorY = box.min.y - hoverGap;
  const wallHeight = ceilingY - floorY;
  const wallCenterY = (ceilingY + floorY) / 2;

  const wallTex = createPanelTexture(4, 4, '#8a8a90', '#6e6e74', '#202024');
  wallTex.repeat.set(16, 8);
  const wall = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, wallHeight, 48, 1, true),
    new THREE.MeshStandardMaterial({ map: wallTex, side: THREE.BackSide, roughness: 0.85, metalness: 0.15 })
  );
  wall.position.set(center.x, wallCenterY, center.z);
  scene.add(wall);

  const floorTex = createPanelTexture(6, 6, '#57575d', '#46464c', '#1c1c1f');
  floorTex.repeat.set(10, 10);
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 48),
    new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(center.x, floorY, center.z);
  scene.add(floor);

  // Ring housing in the ceiling that the pole plugs through, plus a flat annulus around it
  // filling the rest of the opening, both sized off the model's own width at the mount.
  // The annulus gets its own cloned texture (rather than reusing wallTex directly) with a
  // repeat count matched to its own, much smaller size — sharing one texture instance between
  // the cylinder wall and this ring meant one repeat setting had to fit both, so the panel
  // pattern was stretched down to a flat, blurry gray on the smaller ring.
  const ringRadius = Math.max(modelWidth * 0.32, 1.5);
  const tubeRadius = ringRadius * 0.24;
  const ceilingTex = wallTex.clone();
  ceilingTex.needsUpdate = true;
  ceilingTex.repeat.set(10, 10);
  const ceilingAnnulus = new THREE.Mesh(
    new THREE.RingGeometry(ringRadius + tubeRadius * 0.9, radius, 48),
    new THREE.MeshStandardMaterial({ map: ceilingTex, side: THREE.DoubleSide, roughness: 0.85 })
  );
  ceilingAnnulus.rotation.x = Math.PI / 2;
  ceilingAnnulus.position.set(center.x, ceilingY, center.z);
  scene.add(ceilingAnnulus);

  const ceilingRing = new THREE.Mesh(
    new THREE.TorusGeometry(ringRadius, tubeRadius, 16, 48),
    new THREE.MeshStandardMaterial({ color: 0xcfcfd4, roughness: 0.5, metalness: 0.4 })
  );
  ceilingRing.rotation.x = Math.PI / 2;
  ceilingRing.position.set(center.x, ceilingY, center.z);
  scene.add(ceilingRing);

  scene.fog = new THREE.Fog(0x0a0a0c, radius * 0.6, radius * 2.2);

  const chamberLight = new THREE.PointLight(0xccddff, 0.6, radius * 3);
  chamberLight.position.set(center.x, ceilingY - 1, center.z);
  scene.add(chamberLight);

  // Glowing circular light set into the floor beneath her, like the platform in the reference.
  const glowOuter = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.22, 48),
    new THREE.MeshBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.25 })
  );
  glowOuter.rotation.x = -Math.PI / 2;
  glowOuter.position.set(center.x, floorY + 0.015, center.z);
  scene.add(glowOuter);

  const glowInner = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.13, 48),
    new THREE.MeshBasicMaterial({ color: 0xeaf6ff })
  );
  glowInner.rotation.x = -Math.PI / 2;
  glowInner.position.set(center.x, floorY + 0.02, center.z);
  scene.add(glowInner);

  const glowLight = new THREE.PointLight(0xbfe0ff, 0.7, radius * 1.5);
  glowLight.position.set(center.x, floorY + 2, center.z);
  scene.add(glowLight);
}

const clock = new THREE.Clock();

// --- procedural animation state ---
// No shape keys on this model (no mouth), so talking/listening are expressed through
// full-body sway, head tilt, eye tracking, neck pistons, and cable movement instead of lip-sync.
let currentState = 'idle';
let prevState = 'idle';
let transitionStart = 0;
let transitionPending = false;
const TRANSITION_DURATION = 0.6; // seconds to crossfade between states instead of snapping
const rig = {}; // name -> { obj, restQuat }
const cableBones = []; // { obj, restQuat, index, side }
const pistonBones = []; // { obj, restQuat, side }

const STATES = {
  idle:      { bodyAmp: 0.032, bodyFreq: 0.28, headAmp: 0.028, headFreq: 0.38, eyeAmp: 0.02, eyeFreq: 0.15, cableAmp: 0.020, cableFreq: 0.4,  pistonAmp: 0.018, pistonFreq: 0.3 },
  listening: { bodyAmp: 0.035, bodyFreq: 0.35, headAmp: 0.030, headFreq: 0.50, eyeAmp: 0.06, eyeFreq: 0.9,  cableAmp: 0.022, cableFreq: 0.6,  pistonAmp: 0.020, pistonFreq: 0.5, headTilt: 0.06 },
  talking:   { bodyAmp: 0.085, bodyFreq: 1.4,  headAmp: 0.090, headFreq: 2.2,  eyeAmp: 0.09, eyeFreq: 3.2,  cableAmp: 0.065, cableFreq: 2.0,  pistonAmp: 0.055, pistonFreq: 1.8 },
};

// "Looking around the room": only active while idle. The whole body slowly turns to face a
// new random direction every few seconds, with the head leading slightly ahead of the body,
// the way a person's head turns a beat before their shoulders do.
const idleLook = { yaw: 0, pitch: 0, startYaw: 0, startPitch: 0, targetYaw: 0, targetPitch: 0, moveStart: 0, moveDuration: 3, nextChange: 0 };

// Little random flourishes on top of everything else, so idle doesn't feel like a perfect loop.
const idleTwitch = { active: false, timeLeft: 0, duration: 0.35, ex: 0, ey: 0, ez: 0, nextTrigger: 0 };

function captureBone(model, name) {
  const obj = model.getObjectByName(name);
  if (obj) rig[name] = { obj, restQuat: obj.quaternion.clone() };
}

function setupRig(model) {
  ['Root0_JNT', 'Body0_JNT', 'Body1_JNT', 'Neck0_JNT', 'Head0_JNT', 'mainEye_JNT', 'upperEye_JNT', 'lowerEye_JNT'].forEach(n => captureBone(model, n));

  model.traverse((obj) => {
    const cableMatch = obj.name.match(/^(Left|Right|Main)Cable(\d+)_JNT$/);
    if (cableMatch) {
      cableBones.push({ obj, restQuat: obj.quaternion.clone(), side: cableMatch[1], index: parseInt(cableMatch[2], 10) });
    }
    const pistonMatch = obj.name.match(/^(RightNeckPiston|LeftNeckPiston|NeckPistonTop|NeckPistonBtmA|NeckPistonBtmB)(\d+)_JNT$/);
    if (pistonMatch) {
      pistonBones.push({ obj, restQuat: obj.quaternion.clone(), side: pistonMatch[1], index: parseInt(pistonMatch[2], 10) });
    }
  });
}

function applyOffset(entry, ex, ey, ez) {
  if (!entry) return;
  const offset = new THREE.Quaternion().setFromEuler(new THREE.Euler(ex, ey, ez));
  entry.obj.quaternion.copy(entry.restQuat).multiply(offset);
}

// Blends only the amplitude-style parameters between two states, so the wave's height fades
// smoothly with no jump in value. Frequencies are NOT blended: the sine arguments are
// (total elapsed time) * frequency, and elapsed time only grows larger the longer the page
// stays open, so smoothly changing frequency against a large elapsed time made the effective
// speed of the wave spike violently during the fade — worse the longer the page had been
// running. Switching frequency outright avoids that; it doesn't cause a value jump, only a
// change in speed from that moment on.
function blendStates(a, b, k) {
  const out = { ...b };
  for (const key of ['bodyAmp', 'headAmp', 'eyeAmp', 'cableAmp', 'pistonAmp', 'headTilt']) {
    const av = a[key] || 0;
    const bv = b[key] || 0;
    out[key] = av + (bv - av) * k;
  }
  return out;
}

function updateIdleLook(t, dt) {
  if (t > idleLook.nextChange) {
    idleLook.startYaw = idleLook.yaw;
    idleLook.startPitch = idleLook.pitch;
    idleLook.targetYaw = (Math.random() * 2 - 1) * 0.32;    // ~ -18..18 degrees, gentler than before
    idleLook.targetPitch = (Math.random() * 2 - 1) * 0.08;
    idleLook.moveStart = t;
    idleLook.moveDuration = 3.0 + Math.random() * 2.0;      // slow, deliberate turn instead of a snap
    const hold = 2.5 + Math.random() * 3.5;                 // pause once it arrives before turning again
    idleLook.nextChange = t + idleLook.moveDuration + hold;
  }
  // smoothstep easing: starts slow, picks up, eases back down into the new position
  const progress = Math.min(1, (t - idleLook.moveStart) / idleLook.moveDuration);
  const eased = progress * progress * (3 - 2 * progress);
  idleLook.yaw = idleLook.startYaw + (idleLook.targetYaw - idleLook.startYaw) * eased;
  idleLook.pitch = idleLook.startPitch + (idleLook.targetPitch - idleLook.startPitch) * eased;

  if (!idleTwitch.active && t > idleTwitch.nextTrigger) {
    idleTwitch.active = true;
    idleTwitch.timeLeft = idleTwitch.duration;
    idleTwitch.ex = (Math.random() * 2 - 1) * 0.05;
    idleTwitch.ey = (Math.random() * 2 - 1) * 0.08;
    idleTwitch.ez = (Math.random() * 2 - 1) * 0.03;
    idleTwitch.nextTrigger = t + idleTwitch.duration + 3 + Math.random() * 6;
  }
  if (idleTwitch.active) {
    idleTwitch.timeLeft -= dt;
    if (idleTwitch.timeLeft <= 0) idleTwitch.active = false;
  }
}

function updateRig(t, dt) {
  if (transitionPending) { transitionStart = t; transitionPending = false; }
  const transitionProgress = Math.min(1, (t - transitionStart) / TRANSITION_DURATION);
  const transitionEased = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);
  const s = blendStates(STATES[prevState], STATES[currentState], transitionEased);

  const idling = currentState === 'idle';
  if (idling) updateIdleLook(t, dt);
  // Fade the look-around contribution in when entering idle, out when leaving it, instead of
  // switching it on/off outright — idleLook.yaw/pitch simply hold their last value while not idling.
  const idleWeight = idling ? transitionEased : (prevState === 'idle' ? 1 - transitionEased : 0);

  const lookYaw = idleLook.yaw * idleWeight;
  const lookPitch = idleLook.pitch * idleWeight;
  const twitchProgress = idleTwitch.active ? 1 - (idleTwitch.timeLeft / idleTwitch.duration) : 0;
  const twitchEase = (idleTwitch.active ? Math.sin(Math.PI * twitchProgress) : 0) * idleWeight;

  // Full-body sway starts at the root and diminishes as it comes back down through the chain.
  // A second, faster wave (non-integer multiple of the base frequency, so it never lines up
  // into a simple repeating loop) is layered on top so there's always some motion, even where
  // the slow wave crosses zero or sits near its peak.
  const bodySway = Math.sin(t * s.bodyFreq) * s.bodyAmp
                  + Math.sin(t * s.bodyFreq * 2.7 + 3.1) * s.bodyAmp * 0.4;
  const bodyTwist = Math.sin(t * s.bodyFreq * 0.6 + 0.7) * s.bodyAmp * 0.7
                   + Math.sin(t * s.bodyFreq * 2.1 + 1.4) * s.bodyAmp * 0.3;

  applyOffset(rig.Root0_JNT, lookPitch * 0.2, bodyTwist + lookYaw * 1.0, bodySway * 0.5);
  applyOffset(rig.Body0_JNT, bodySway * 0.6 + lookPitch * 0.3, bodyTwist * 0.6 + lookYaw * 0.85, 0);
  applyOffset(rig.Body1_JNT, bodySway * 0.8 + lookPitch * 0.4, bodyTwist * 0.4 + lookYaw * 0.7, 0);

  const headSway = Math.sin(t * s.headFreq) * s.headAmp
                  + Math.sin(t * s.headFreq * 3.3 + 1.8) * s.headAmp * 0.35;
  const headNod = Math.sin(t * s.headFreq * 1.7 + 1.0) * s.headAmp * 0.6
                 + Math.sin(t * s.headFreq * 4.1 + 0.5) * s.headAmp * 0.25;
  const tilt = s.headTilt || 0;
  applyOffset(rig.Neck0_JNT, headNod * 0.5 + lookPitch * 0.7, headSway * 0.5 + lookYaw * 0.9, 0);
  applyOffset(rig.Head0_JNT, headNod + lookPitch, headSway + lookYaw, tilt);

  const eyeX = Math.sin(t * s.eyeFreq) * s.eyeAmp + twitchEase * idleTwitch.ex;
  const eyeY = Math.cos(t * s.eyeFreq * 0.8) * s.eyeAmp + twitchEase * idleTwitch.ey;
  applyOffset(rig.mainEye_JNT, eyeX, eyeY, twitchEase * idleTwitch.ez);
  applyOffset(rig.upperEye_JNT, eyeX * 0.5, 0, 0);
  applyOffset(rig.lowerEye_JNT, -eyeX * 0.5, 0, 0);

  for (const c of cableBones) {
    const phase = c.index * 0.5 + (c.side === 'Right' ? 1.5 : c.side === 'Main' ? 3.0 : 0);
    const bend = Math.sin(t * s.cableFreq + phase) * s.cableAmp;
    applyOffset(c, bend, bend * 0.6, 0);
  }

  for (const p of pistonBones) {
    const phase = p.index * 0.8 + (p.side.includes('Right') ? 0.5 : p.side.includes('Left') ? 2.5 : 4.5);
    const bend = Math.sin(t * s.pistonFreq + phase) * s.pistonAmp;
    applyOffset(p, bend * 0.5, 0, bend);
  }
}

// Personality core, attached near the neck. It's a separate asset rip from a different source
// than the main model, so its native scale doesn't match hers — CORE_SCALE and CORE_OFFSET are
// tuned by eye against her actual proportions rather than computed from anything.
const CORE_NAMES = ['default', 'variant1', 'variant2', 'variant3', 'damaged'];
const coreMeshes = {};
let currentCore = 'default';
let CORE_SCALE = 1;
// Neck0_JNT carries a baked-in world scale of ~0.0254 (a Source-engine inches-to-meters
// artifact), which shrinks any local-space offset by the same factor before it reaches world
// space — small local numbers barely moved the core at all until that was accounted for here.
const CORE_OFFSET = { x: 115, y: 20, z: -10 };

function loadCores() {
  const coreLoader = new GLTFLoader();
  for (const name of CORE_NAMES) {
    coreLoader.load(`core_variants/core_${name}.glb`, (gltf) => {
      const obj = gltf.scene;
      obj.scale.setScalar(CORE_SCALE);
      obj.position.set(CORE_OFFSET.x, CORE_OFFSET.y, CORE_OFFSET.z);
      obj.rotation.y = Math.PI; // turns the eye disc to face the camera's default position
      obj.visible = name === currentCore;
      if (rig.Neck0_JNT) rig.Neck0_JNT.obj.add(obj);
      coreMeshes[name] = obj;
      window.__coreMeshes = coreMeshes; // debug access
    }, undefined, (err) => {
      info.textContent = `core load ERROR (${name}): ${err.message}`;
    });
  }
}

document.querySelectorAll('#coreControls button').forEach(btn => {
  if (btn.dataset.core === currentCore) btn.classList.add('active');
  btn.addEventListener('click', () => {
    currentCore = btn.dataset.core;
    for (const name of CORE_NAMES) {
      if (coreMeshes[name]) coreMeshes[name].visible = (name === currentCore);
    }
    document.querySelectorAll('#coreControls button').forEach(b => b.classList.toggle('active', b === btn));
  });
});

const loader = new GLTFLoader();
loader.load('glados_model.glb', (gltf) => {
  const model = gltf.scene;
  scene.add(model);

  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  controls.target.copy(center);
  const dist = size.length() * 1.2 || 3;
  // Clamp the camera's height so it can't end up above the ceiling or below the floor now that
  // both sit close to the model — it grazed straight through the ceiling before this was added.
  const camY = THREE.MathUtils.clamp(center.y + dist * 0.3, box.min.y + 1.5, box.max.y - 1.5);
  camera.position.set(center.x + dist * 0.5, camY, center.z + dist * 0.5);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();
  controls.update();

  // The bounding box's x/z center gets pulled off to one side by the cables splaying out
  // asymmetrically, so it doesn't actually land on the pole. Root0_JNT is the base of the
  // rig, directly under the ceiling mount, so its own world position is the real anchor point.
  model.updateMatrixWorld(true);
  const rootBone = model.getObjectByName('Root0_JNT');
  const poleXZ = rootBone ? rootBone.getWorldPosition(new THREE.Vector3()) : center;

  buildChamber(box, poleXZ, dist);
  setupRig(model);
  loadCores();
  info.textContent = `loaded. state=${currentState} cables=${cableBones.length} pistons=${pistonBones.length}`;

  window.__viewerReady = true;
}, undefined, (err) => {
  info.textContent = 'ERROR: ' + err.message;
  window.__viewerError = err.message;
});

document.querySelectorAll('#controls button').forEach(btn => {
  if (btn.dataset.state === currentState) btn.classList.add('active');
  btn.addEventListener('click', () => {
    if (btn.dataset.state === currentState) return;
    prevState = currentState;
    currentState = btn.dataset.state;
    transitionPending = true;
    document.querySelectorAll('#controls button').forEach(b => b.classList.toggle('active', b === btn));
    info.textContent = `state=${currentState}`;
  });
});

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  updateRig(clock.getElapsedTime(), dt);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
