<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLaDOS Chamber Preview</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151a;color:#eef2f3;font:14px/1.45 "Segoe UI",system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}#hud{position:fixed;z-index:2;top:16px;left:16px;padding:14px 16px;max-width:min(440px,calc(100vw - 32px));background:#111820dd;border:1px solid #62717a;border-radius:6px;box-shadow:0 8px 28px #0008;backdrop-filter:blur(8px)}
  h1{font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}#status{font-size:12px;color:#b9c7cc;margin-bottom:12px}.toggles{display:flex;gap:14px;flex-wrap:wrap}.toggles label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}input{accent-color:#68c5ee}
  #help{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#111820cc;border:1px solid #52616a;border-radius:5px;color:#cbd5d9;font-size:12px;text-align:center;white-space:nowrap}
  @media(max-width:520px){#help{white-space:normal;width:calc(100% - 24px)}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><h1>GLaDOS Chamber · Preview</h1><div id="status">Loading the chamber and GLaDOS models…</div><div class="toggles"><label><input id="roomToggle" type="checkbox" checked> Chamber</label><label><input id="gladosToggle" type="checkbox" checked> GLaDOS</label><label><input id="gridToggle" type="checkbox"> Coordinate grid</label></div></div>
<div id="help">Left-drag: orbit · Right-drag: pan · Wheel: zoom · Double-click: focus GLaDOS</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x18212a);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,3000);camera.position.set(0,5,14);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=2;controls.maxDistance=500;controls.target.set(0,4,0);controls.update();
scene.add(new THREE.HemisphereLight(0xe8f2ff,0x242832,2));const key=new THREE.DirectionalLight(0xfff3df,3);key.position.set(8,16,10);scene.add(key);const fill=new THREE.DirectionalLight(0x86bfff,1.4);fill.position.set(-10,7,-8);scene.add(fill);
const grid=new THREE.GridHelper(60,60,0x668099,0x33404c);grid.visible=false;scene.add(grid);
let room=null,model=null,eyeTarget=new THREE.Vector3(0,5,0);
function alignRoom(){if(!room||!model)return;const root=model.getObjectByName('Root0_JNT');const rootWorld=root?root.getWorldPosition(new THREE.Vector3()):new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());room.position.set(rootWorld.x+.005,rootWorld.y-3.182,rootWorld.z+.085);room.updateMatrixWorld(true);}
const loader=new GLTFLoader();const done={room:false,model:false};
function updateStatus(){if(done.room&&done.model)status.textContent='Both models loaded. Orbit, pan, and zoom to inspect; toggles isolate either asset.';}
loader.load('chamber_model.glb',g=>{room=g.scene;room.name='Portal 2 chamber geometry';const anchor=new THREE.Vector3(-.005,3.182,-.085);scene.add(room);if(done.model)alignRoom();done.room=true;document.querySelector('#roomToggle').disabled=false;updateStatus();},undefined,e=>{status.textContent='Chamber failed to load: '+e.message;});
loader.load('glados_model.glb',g=>{model=g.scene;model.name='GLaDOS';scene.add(model);model.updateMatrixWorld(true);const eye=model.getObjectByName('mainEye_JNT')||model.getObjectByName('Head0_JNT');eyeTarget=eye?eye.getWorldPosition(new THREE.Vector3()):new THREE.Box3().setFromObject(model).getCenter(new THREE.Vector3());alignRoom();controls.target.copy(eyeTarget);camera.position.set(eyeTarget.x,eyeTarget.y-2,eyeTarget.z+12);controls.update();done.model=true;document.querySelector('#gladosToggle').disabled=false;updateStatus();},undefined,e=>{status.textContent='GLaDOS failed to load: '+e.message;});
document.querySelector('#roomToggle').addEventListener('change',e=>{if(room)room.visible=e.target.checked;});document.querySelector('#gladosToggle').addEventListener('change',e=>{if(model)model.visible=e.target.checked;});document.querySelector('#gridToggle').addEventListener('change',e=>grid.visible=e.target.checked);
renderer.domElement.addEventListener('dblclick',()=>{controls.target.copy(eyeTarget);controls.update();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}animate();
</script>
</body>
</html>
